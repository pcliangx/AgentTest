<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Squad HQ · 桌面端项目配置</title>
    <style>
      /* SINGLE-SCHEME DESKTOP UI PROTOTYPE —方案 A */
      :root {
        --bg: #ffffff;
        --surface: #f7f8fa;
        --fg: #111111;
        --muted: #6b7280;
        --border: #d9dee7;
        --accent: #1677ff;
        --font-display: Inter, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --font-body: Inter, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --shadow-sm: 0 1px 2px color-mix(in oklab, var(--fg) 8%, transparent);
        --shadow-md: 0 16px 48px color-mix(in oklab, var(--fg) 16%, transparent);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      #root { width: 100%; height: 100%; }
      body { overflow: hidden; background: var(--surface); color: var(--fg); font-family: var(--font-body); font-size: 13px; line-height: 1.45; }
      button, input, select { font: inherit; }
      button { color: inherit; letter-spacing: 0.02em; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      svg { display: block; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      [hidden] { display: none !important; }

      .window { display: flex; width: 100%; height: 100%; min-width: 880px; min-height: 620px; flex-direction: column; overflow: hidden; background: var(--bg); }
      .titlebar { position: relative; display: flex; height: 40px; flex: 0 0 40px; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 12px; user-select: none; }
      .window-controls { display: flex; gap: 7px; }
      .window-control { width: 11px; height: 11px; border: 1px solid var(--muted); border-radius: 50%; background: var(--bg); }
      .window-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 550; }
      .title-project { margin-left: auto; color: var(--muted); font-size: 11px; }
      .toolbar { display: flex; height: 46px; flex: 0 0 46px; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); background: var(--bg); padding: 0 10px; }
      .toolbar-title { margin-left: 5px; font-weight: 600; }
      .toolbar-divider { width: 1px; height: 22px; margin: 0 5px; background: var(--border); }
      .toolbar-spacer { flex: 1; }
      .key { color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .button, .icon-button { display: inline-flex; min-height: 32px; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 0 10px; cursor: pointer; font-weight: 550; }
      .button:hover, .icon-button:hover { background: var(--surface); }
      .button.secondary { border-color: var(--border); background: var(--bg); box-shadow: var(--shadow-sm); }
      .button.primary { background: var(--accent); color: var(--bg); box-shadow: 0 2px 0 color-mix(in oklab, var(--accent) 68%, var(--fg)); }
      .button.primary:active { transform: translateY(2px); box-shadow: none; }
      .icon-button { width: 32px; padding: 0; color: var(--muted); }
      .button:disabled, .icon-button:disabled { cursor: not-allowed; opacity: 0.48; }

      .desktop-body { display: grid; min-width: 0; min-height: 0; flex: 1; }
      .desktop-body.variant-a { grid-template-columns: 52px 270px minmax(0, 1fr); }
      .rail { display: flex; min-height: 0; flex-direction: column; align-items: center; gap: 6px; border-right: 1px solid var(--border); background: var(--surface); padding: 8px 0; }
      .rail-button { display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
      .rail-button:hover { background: var(--bg); color: var(--fg); }
      .rail-button.active { background: var(--fg); color: var(--bg); }
      .rail-spacer { flex: 1; }
      .source-list { min-height: 0; overflow: auto; border-right: 1px solid var(--border); background: var(--surface); padding: 10px 8px 48px; }
      .source-heading { display: flex; align-items: center; justify-content: space-between; min-height: 32px; padding: 0 7px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
      .source-group { display: grid; gap: 2px; margin-bottom: 10px; }
      .source-item { display: grid; width: 100%; min-height: 46px; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 5px 7px; text-align: left; cursor: pointer; }
      .source-item:hover { background: var(--bg); }
      .source-item.selected { border-color: var(--fg); background: var(--bg); box-shadow: var(--shadow-sm); }
      .glyph { display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
      .source-item strong { display: block; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .source-item small { display: block; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .provider-code { display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
      .source-item.selected .provider-code { border-color: var(--fg); }
      .status-dot { width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; }
      .status-dot.on { border-color: var(--fg); background: var(--fg); }
      .account-tile { position: sticky; bottom: 0; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; border-top: 1px solid var(--border); background: var(--surface); margin: 12px -8px -48px; padding: 10px 15px; }
      .account-tile strong { display: block; font-size: 11px; }
      .account-tile small { display: block; color: var(--muted); font-size: 10px; }

      .detail-pane { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: var(--bg); }
      .detail-header { display: grid; min-height: 70px; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding: 10px 16px; }
      .detail-header .glyph { width: 36px; height: 36px; background: var(--surface); }
      .detail-header h1 { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
      .detail-header p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
      .status-label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
      .detail-scroll { min-height: 0; flex: 1; overflow: auto; }
      .form-table { max-width: 820px; padding: 4px 18px 80px; }
      .form-section { border-bottom: 1px solid var(--border); padding: 14px 0; }
      .form-section:last-child { border-bottom: 0; }
      .form-row { display: grid; grid-template-columns: minmax(190px, 0.42fr) minmax(280px, 0.58fr); align-items: start; gap: 22px; padding: 8px 0; }
      .form-label strong { display: block; font-size: 12px; font-weight: 600; }
      .form-label p { max-width: 46ch; margin: 3px 0 0; color: var(--muted); font-size: 11px; }
      .form-control { min-width: 0; }
      .select { width: 100%; max-width: 360px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 0 9px; color: var(--fg); }
      .text-input { width: 100%; max-width: 360px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 0 9px; color: var(--fg); }
      .readonly-value { display: flex; min-height: 34px; max-width: 520px; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 6px 9px; }
      .readonly-value strong { font-size: 11px; }
      .readonly-value small { color: var(--muted); font-size: 10px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .button-row { display: flex; flex-wrap: wrap; gap: 7px; }
      .environment-list { display: grid; width: 100%; max-width: 620px; gap: 5px; }
      .environment-header, .environment-row { display: grid; grid-template-columns: minmax(130px, 0.8fr) minmax(180px, 1.2fr) 92px 66px; align-items: center; gap: 5px; }
      .environment-header { padding: 0 7px; color: var(--muted); font-size: 10px; letter-spacing: 0.02em; }
      .environment-row { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 5px; }
      .environment-row .text-input, .environment-row .select { width: 100%; max-width: none; height: 30px; }
      .environment-actions { display: flex; justify-content: flex-end; gap: 2px; }
      .environment-actions .icon-button { width: 28px; min-height: 28px; }
      .environment-empty { border: 1px dashed var(--border); border-radius: 8px; background: var(--surface); padding: 10px; color: var(--muted); font-size: 11px; }
      .environment-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .button.danger { border-color: var(--fg); background: var(--bg); }
      .button.danger:hover { background: var(--fg); color: var(--bg); }
      .section-note { margin: 0 0 5px; color: var(--muted); font-size: 10px; }
      .switch { position: relative; width: 38px; height: 22px; border: 0; border-radius: 999px; background: var(--border); padding: 0; cursor: pointer; }
      .switch::after { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); box-shadow: var(--shadow-sm); content: ""; transition: 140ms ease; }
      .switch[aria-checked="true"] { background: var(--fg); }
      .switch[aria-checked="true"]::after { transform: translateX(16px); }
      .resource-list { display: grid; max-width: 520px; gap: 4px; }
      .resource-row { display: grid; min-height: 38px; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 5px 8px; text-align: left; cursor: pointer; }
      .resource-row:hover { background: var(--surface); }
      .resource-row[aria-checked="true"] { border-color: var(--fg); }
      .check { display: grid; width: 16px; height: 16px; place-items: center; border: 1px solid var(--border); border-radius: 4px; }
      .resource-row[aria-checked="true"] .check { border-color: var(--fg); background: var(--fg); color: var(--bg); }
      .resource-row strong { font-size: 11px; }
      .resource-row small { color: var(--muted); font-size: 10px; }
      .tag { border: 1px solid var(--border); border-radius: 8px; padding: 2px 6px; color: var(--muted); font-size: 10px; }
      .detail-footer { display: flex; height: 46px; flex: 0 0 46px; align-items: center; gap: 8px; border-top: 1px solid var(--border); background: var(--surface); padding: 0 12px; }
      .footer-note { color: var(--muted); font-size: 10px; }
      .footer-spacer { flex: 1; }

      .statusbar { display: flex; height: 26px; flex: 0 0 26px; align-items: center; gap: 12px; border-top: 1px solid var(--border); background: var(--surface); padding: 0 10px; color: var(--muted); font-size: 10px; }
      .statusbar-spacer { flex: 1; }

      .sheet-backdrop { position: fixed; z-index: 90; inset: 40px 0 26px; display: grid; align-items: start; justify-items: center; background: color-mix(in oklab, var(--fg) 38%, transparent); padding-top: 20px; }
      .sheet { width: min(520px, calc(100% - 32px)); border: 1px solid var(--border); border-radius: 8px; background: var(--bg); box-shadow: var(--shadow-md); }
      .sheet-head { border-bottom: 1px solid var(--border); padding: 14px 16px; }
      .sheet-head h2 { margin: 0; font-size: 16px; }
      .sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
      .sheet-body { padding: 14px 16px; }
      .scope-line { display: flex; align-items: center; gap: 7px; padding: 5px 0; }
      .sheet-actions { display: flex; justify-content: flex-end; gap: 7px; border-top: 1px solid var(--border); background: var(--surface); padding: 9px 12px; }
      .toast { position: fixed; z-index: 100; right: 12px; bottom: 36px; transform: translateY(6px); border: 1px solid var(--fg); border-radius: 8px; background: var(--fg); padding: 8px 10px; color: var(--bg); opacity: 0; pointer-events: none; transition: 150ms ease; font-size: 11px; }
      .toast.show { transform: translateY(0); opacity: 1; }

      @media (max-width: 1050px) {
        .desktop-body.variant-a { grid-template-columns: 48px 230px minmax(0, 1fr); }
        .form-row { grid-template-columns: 170px minmax(240px, 1fr); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>


    <div class="sheet-backdrop" id="feishuSheet" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head"><h2 id="sheetTitle">连接飞书工作区</h2><p>任务清单和知识库共享一次工作区授权。</p></div>
        <div class="sheet-body"><div class="scope-line"><span class="status-dot on"></span>读取选择的任务清单</div><div class="scope-line"><span class="status-dot on"></span>读取选择的知识空间</div><div class="scope-line"><span class="status-dot"></span>写入权限接入后单独开启</div></div>
        <div class="sheet-actions"><button class="button secondary" type="button" data-close-sheet>取消</button><button class="button primary" type="button" id="confirmFeishu">确认模拟授权</button></div>
      </section>
    </div>
    <div class="sheet-backdrop" id="agentActionSheet" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="agentActionTitle">
        <div class="sheet-head"><h2 id="agentActionTitle">删除 Agent？</h2><p id="agentActionDescription"></p></div>
        <div class="sheet-body"><div class="scope-line"><span class="status-dot on"></span>关闭该实例已打开的 Tab</div><div class="scope-line"><span class="status-dot on"></span>移除会话与运行状态</div><div class="scope-line"><span class="status-dot on"></span>清理 worktree 前仍需再次确认</div></div>
        <div class="sheet-actions"><button class="button secondary" type="button" data-close-agent-sheet>取消</button><button class="button danger" type="button" id="confirmDeleteAgent">确认删除</button></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const icons = {
        agent: '<path d="M12 8V4H8M12 4h4"></path><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M8 13h.01M16 13h.01M9 17h6"></path>',
        task: '<rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="m8 11 2 2 4-4M8 16h8"></path>',
        wiki: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22Z"></path><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22Z"></path>',
        settings: '<circle cx="12" cy="12" r="3"></circle><path d="M19 12h2M3 12h2M12 3v2M12 19v2M18.4 5.6 17 7M7 17l-1.4 1.4M18.4 18.4 17 17M7 7 5.6 5.6"></path>',
        grid: '<rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect>',
        activity: '<path d="M3 12h4l2-7 4 14 2-7h6"></path>',
        back: '<path d="m15 18-6-6 6-6"></path>',
        forward: '<path d="m9 18 6-6-6-6"></path>',
        save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><path d="M17 21v-8H7v8M7 3v5h8"></path>',
        link: '<path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"></path>',
        check: '<path d="m5 12 4 4L19 6"></path>',
        plus: '<path d="M12 5v14M5 12h14"></path>',
        eye: '<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle>',
        eyeOff: '<path d="m3 3 18 18M10.6 6.1A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-2.1 2.8M6.6 6.6C4 8.3 2.5 12 2.5 12s3.5 6 9.5 6c1 0 2-.2 2.8-.5M10 10a2.8 2.8 0 0 0 4 4"></path>',
        trash: '<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path>'
      };
      const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
      const integrations = {
        agent: { name: 'Agent 默认设置', subtitle: 'Provider、项目权限与操作确认', icon: 'agent' },
        tasks: { name: '飞书任务清单', subtitle: '2 个清单 · 双向同步', icon: 'task' },
        wiki: { name: '飞书知识库', subtitle: '2 个空间 · 只读', icon: 'wiki' }
      };
      let agents = [
        { id: 'cc_data', name: 'cc_data', provider: 'Claude Code', code: 'CL', model: 'Sonnet 4.5', reasoning: '高', status: '运行中', workspace: '独立 worktree', worktree: 'agent/cc-data', fileWrite: true, network: true, external: true, terminal: true, confirm: true },
        { id: 'cc_sql', name: 'cc_sql', provider: 'Claude Code', code: 'CL', model: 'Provider 默认模型', reasoning: '标准', status: '就绪', workspace: '独立 worktree', worktree: 'agent/cc-sql', fileWrite: true, network: false, external: true, terminal: true, confirm: true },
        { id: 'cx_anti', name: 'cx_anti', provider: 'Codex', code: 'CX', model: 'gpt-5.6', reasoning: '高', status: '需要确认', workspace: '独立 worktree', worktree: 'agent/cx-anti', fileWrite: true, network: true, external: false, terminal: true, confirm: true },
        { id: 'cx_forecast', name: 'cx_forecast', provider: 'Codex', code: 'CX', model: 'Provider 默认模型', reasoning: '标准', status: '已停止', workspace: '独立 worktree', worktree: 'agent/cx-forecast', fileWrite: true, network: false, external: true, terminal: true, confirm: true },
        { id: 'kimi_visual', name: 'kimi_visual', provider: 'Kimi Code', code: 'KM', model: 'K2.5', reasoning: '标准', status: '运行中', workspace: '独立 worktree', worktree: 'agent/kimi-visual', fileWrite: true, network: true, external: true, terminal: true, confirm: true }
      ];
      agents = agents.map((agent) => ({ ...agent, proxyMode: '继承系统代理', proxyUrl: '', proxyBypass: 'localhost, 127.0.0.1', env: [] }));
      const state = {
        active: 'agent:cc_data', dirty: false, connected: true, sheet: false, agentSheet: false, pendingDelete: null, lastFocused: null,
        agentFiles: true, agentConfirm: true, taskEnabled: true, taskWrite: true, taskEvents: true, wikiEnabled: true, wikiWrite: false, wikiEvents: true,
        taskLists: ['产品迭代', 'Agent 协作任务'], wikiSpaces: ['产品知识库', '研究资料'], taskSync: '双向同步',
        defaultProvider: 'Codex', defaultModel: 'Provider 默认模型', defaultOpen: '当前 Panel', defaultWorkspace: '独立 worktree', defaultConfirm: true
      };
      const $ = (selector) => document.querySelector(selector);
      const bool = (name) => Boolean(state[name]);
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
      const sectionFor = (active = state.active) => active.startsWith('agent') ? 'agent' : active;
      const activeAgent = (active = state.active) => active.startsWith('agent:') ? agents.find((agent) => agent.id === active.slice(6)) : null;

      function titlebar() {
        return `<div class="titlebar" data-od-id="desktop-titlebar"><div class="window-controls"><span class="window-control"></span><span class="window-control"></span><span class="window-control"></span></div><div class="window-title">Agent Squad HQ — 项目设置</div><div class="title-project">销售数据分析</div></div>`;
      }
      function toolbar() {
        return `<div class="toolbar" data-od-id="desktop-toolbar"><button class="icon-button" type="button" aria-label="返回工作台" title="返回工作台" data-nav="workspace">${icon('back')}</button><button class="icon-button" type="button" aria-label="打开项目列表" title="项目列表" data-nav="projects">${icon('forward')}</button><span class="toolbar-divider"></span><span class="toolbar-title">项目设置 / 接入与资源</span><span class="toolbar-spacer"></span><span class="key">${state.dirty ? '有未保存修改' : '配置已同步'}</span><button class="button primary" type="button" data-save>${icon('save')}应用 <span class="key">⌘S</span></button></div>`;
      }
      function statusbar() {
        const selected = activeAgent();
        return `<div class="statusbar" data-od-id="desktop-statusbar"><span>销售数据分析</span><span>Agent：${agents.length}</span><span>飞书：${state.connected ? '已连接' : '未连接'}</span><span>任务清单：${state.taskLists.length}</span><span>知识空间：${state.wikiSpaces.length}</span><span class="statusbar-spacer"></span><span>${selected ? `${selected.name} · ${selected.status}` : '设置仅作用于当前 Project'}</span></div>`;
      }
      function rail() {
        return `<aside class="rail" data-od-id="desktop-app-rail"><button class="rail-button" type="button" title="工作台" aria-label="返回工作台" data-nav="workspace">${icon('grid')}</button><button class="rail-button active" type="button" title="项目设置" aria-label="项目设置">${icon('settings')}</button><button class="rail-button" type="button" title="活动" aria-label="活动暂未纳入原型" disabled>${icon('activity')}</button><span class="rail-spacer"></span><button class="rail-button" type="button" title="连接飞书" data-connect>${icon('link')}</button></aside>`;
      }
      function sourceList() {

      }
      function metaFor(active = state.active) {

      function switcher(name, label) {

      function modelOptions(provider, selected) {

      function agentDefaultContent() {

      function environmentEditor(agent) {

      function proxyControls(agent) {
        const custom = agent.proxyMode === '自定义代理';
        return `${row('代理模式','按 Agent 隔离网络出口；关闭代理不会影响其他实例。',`<select class="select" data-agent-field="proxyMode"><option ${agent.proxyMode === '继承系统代理' ? 'selected' : ''}>继承系统代理</option><option ${agent.proxyMode === '不使用代理' ? 'selected' : ''}>不使用代理</option><option ${custom ? 'selected' : ''}>自定义代理</option></select>`)}${custom ? `${row('代理地址','支持 http、https 与 socks5；地址中不要直接包含账号密码。',`<input class="text-input mono" value="${escapeHtml(agent.proxyUrl)}" placeholder="http://127.0.0.1:7890" aria-label="代理服务器地址" data-agent-field="proxyUrl" />`)}${row('绕过地址','以英文逗号分隔；本地回环地址默认绕过代理。',`<input class="text-input mono" value="${escapeHtml(agent.proxyBypass)}" aria-label="代理绕过地址" data-agent-field="proxyBypass" />`)}${row('连接检查','只检查该 Agent 的代理出口，不修改全局网络设置。','<button class="button secondary" type="button" data-proxy-test>测试代理连接</button>')}` : ''}`;

      function agentInstanceContent(agent) {

}</section><section class="form-section">${row('关键操作确认','外部写入、停止运行和删除实例前要求确认。',agentSwitcher('confirm','关键操作前确认',agent))}${row('实例生命周期','关闭 Tab 只隐藏界面；停止会终止运行；删除会移除会话与实例。',`<div class="button-row"><button class="button secondary" type="button" data-agent-action="toggle">${agent.status === '已停止' ? '启动实例' : '停止运行'}</button><button class="button secondary" type="button" data-agent-action="restart">重新启动</button><button class="button danger" type="button" data-agent-action="delete">删除 Agent</button></div>`)}</section></div>`;
      }
      function detailContent(active = state.active) {
        if (sectionFor(active) !== 'agent' && !state.connected) return `<div class="form-table"><div class="form-section">${row('连接飞书工作区','任务清单和知识库共享一次授权。',`<button class="button primary" type="button" data-connect>${icon('link')}连接飞书</button>`)}</div></div>`;

        if (active === 'tasks') return `<div class="form-table"><section class="form-section">${row('启用接入','关闭后保留资源选择，但停止同步。',switcher('taskEnabled','启用任务清单'))}${row('任务清单范围','只同步明确选择的任务清单。',resources('tasks',['产品迭代','Agent 协作任务','项目交付'],state.taskLists))}</section><section class="form-section">${row('同步方向','双向同步允许 Agent 更新任务状态。',`<select class="select" data-task-sync><option ${state.taskSync === '只读同步' ? 'selected' : ''}>只读同步</option><option ${state.taskSync === '双向同步' ? 'selected' : ''}>双向同步</option></select>`)}${row('Agent 更新任务','允许更新状态、负责人和备注，不允许删除。',switcher('taskWrite','允许 Agent 更新任务'))}${row('任务事件','将任务变更送入项目活动流。',switcher('taskEvents','接收任务事件'))}</section></div>`;
        return `<div class="form-table"><section class="form-section">${row('启用接入','关闭后停止索引和检索。',switcher('wikiEnabled','启用知识库'))}${row('知识范围','按知识空间接入，可进一步限制目录。',resources('wiki',['产品知识库','研究资料','会议纪要'],state.wikiSpaces))}</section><section class="form-section">${row('检索方式','默认在 Agent 需要背景信息时自动检索。','<select class="select"><option>Agent 按需自动检索</option><option>仅明确引用时检索</option></select>')}${row('编辑文档','默认关闭，开启后仍需重要操作确认。',switcher('wikiWrite','允许 Agent 编辑文档'))}${row('文档事件','更新文档后刷新本地索引。',switcher('wikiEvents','接收文档更新事件'))}</section></div>`;

      function variantA() {
        return `<div class="window">${titlebar()}${toolbar()}<div class="desktop-body variant-a">${rail()}${sourceList()}${detailPane()}</div>${statusbar()}</div>`;

      function renderAll() {
        $('#root').innerHTML=variantA();

      function dirty(){state.dirty=true;}
      function toggle(name){state[name]=!state[name];dirty();renderAll();}
      function toggleAgentSetting(name){const agent=activeAgent();if(!agent)return;if(name==='fileWrite'&&agent.workspace==='共享项目目录（只读）'){showToast('共享项目目录保持只读，不能开启文件写入');return;}agent[name]=!agent[name];dirty();renderAll();}
      function handleEnvironmentAction(action,id){const agent=activeAgent();if(!agent)return;if(action==='add'){const variable={id:`env_${Date.now()}`,key:'',value:'',secret:false,revealed:false};agent.env.push(variable);dirty();renderAll();requestAnimationFrame(()=>document.querySelector(`[data-env-id="${variable.id}"][data-env-field="key"]`)?.focus());return;}const variable=agent.env.find((item)=>item.id===id);if(!variable)return;if(action==='remove')agent.env=agent.env.filter((item)=>item.id!==id);if(action==='reveal')variable.revealed=!variable.revealed;dirty();renderAll();}
      function toggleResource(kind,value){const key=kind==='tasks'?'taskLists':'wikiSpaces';state[key]=state[key].includes(value)?state[key].filter(item=>item!==value):[...state[key],value];dirty();renderAll();}
      function openSheet(){state.lastFocused=document.activeElement;state.sheet=true;$('#feishuSheet').hidden=false;requestAnimationFrame(()=>$('#feishuSheet button')?.focus());}
      function closeSheet(){state.sheet=false;$('#feishuSheet').hidden=true;state.lastFocused?.focus?.();}
      function openAgentSheet(){const agent=activeAgent();if(!agent)return;state.lastFocused=document.activeElement;state.pendingDelete=agent.id;state.agentSheet=true;$('#agentActionDescription').textContent=`“${agent.name}”将从当前项目中移除。此操作不会直接删除 worktree 文件。`;$('#agentActionSheet').hidden=false;requestAnimationFrame(()=>$('#agentActionSheet button')?.focus());}
      function closeAgentSheet(){state.agentSheet=false;state.pendingDelete=null;$('#agentActionSheet').hidden=true;state.lastFocused?.focus?.();}
      function activeSheetRoot(){if(state.agentSheet)return $('#agentActionSheet');if(state.sheet)return $('#feishuSheet');return null;}
      function trapSheetFocus(event){const sheet=activeSheetRoot();if(!sheet||event.key!=='Tab')return;const controls=[...sheet.querySelectorAll('button:not([disabled]),select:not([disabled]),input:not([disabled])')];if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
      function handleAgentAction(action){const agent=activeAgent();if(!agent)return;if(action==='delete'){openAgentSheet();return;}if(action==='toggle'){agent.status=agent.status==='已停止'?'运行中':'已停止';dirty();renderAll();showToast(agent.status==='已停止'?'Agent 已停止，配置与会话仍保留':'Agent 已启动');return;}if(action==='restart'){agent.status='启动中';dirty();renderAll();showToast('正在重新启动 Agent');setTimeout(()=>{const current=agents.find((item)=>item.id===agent.id);if(!current)return;current.status='就绪';renderAll();showToast('Agent 已重新启动');},900);}}
      function showToast(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2000);}

      document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.nav==='workspace'){location.href='project-command-center-light-prototype.html?variant=A';return;}if(button.dataset.nav==='projects'){location.href='project-command-center-projects-prototype.html?variant=A';return;}if(button.dataset.integration){state.active=button.dataset.integration;renderAll();}if(button.dataset.setting)toggle(button.dataset.setting);if(button.dataset.agentSetting)toggleAgentSetting(button.dataset.agentSetting);if(button.dataset.agentAction)handleAgentAction(button.dataset.agentAction);if(button.dataset.envAction)handleEnvironmentAction(button.dataset.envAction,button.dataset.envId);if(button.hasAttribute('data-proxy-test'))showToast('原型未连接真实网络；正式实现将仅测试当前 Agent 的代理出口');if(button.dataset.resourceKind)toggleResource(button.dataset.resourceKind,button.dataset.resourceValue);if(button.hasAttribute('data-connect'))openSheet();if(button.hasAttribute('data-close-sheet'))closeSheet();if(button.hasAttribute('data-close-agent-sheet'))closeAgentSheet();if(button.id==='confirmDeleteAgent'){const deleted=agents.find((agent)=>agent.id===state.pendingDelete);agents=agents.filter((agent)=>agent.id!==state.pendingDelete);state.active=agents[0]?`agent:${agents[0].id}`:'agent-defaults';dirty();closeAgentSheet();renderAll();showToast(`${deleted?.name||'Agent'} 已从项目移除`);}if(button.id==='confirmFeishu'){state.connected=true;state.taskEnabled=true;state.wikiEnabled=true;dirty();closeSheet();renderAll();showToast('飞书工作区已完成模拟连接');}if(button.hasAttribute('data-save')){state.dirty=false;renderAll();showToast('配置已应用到当前项目');}});
      document.addEventListener('change',event=>{const target=event.target;if(target.matches('[data-default-field]')){state[target.dataset.defaultField]=target.value;if(target.dataset.defaultField==='defaultProvider')state.defaultModel='Provider 默认模型';dirty();renderAll();}if(target.matches('[data-agent-field]')){const agent=activeAgent();if(!agent)return;const field=target.dataset.agentField,value=target.value.trim();if(field==='name'){const valid=/^[A-Za-z][A-Za-z0-9_-]{1,31}$/.test(value),duplicate=agents.some((item)=>item.id!==agent.id&&item.name===value);if(!valid||duplicate){renderAll();showToast(duplicate?'Agent 名称已存在':'名称需以字母开头，可含数字、下划线或连字符');return;}}if(field==='proxyUrl'&&value&&!/^(https?|socks5):\/\//i.test(value)){renderAll();showToast('代理地址需要以 http://、https:// 或 socks5:// 开头');return;}agent[field]=value;if(field==='workspace'&&value==='共享项目目录（只读）')agent.fileWrite=false;dirty();renderAll();}if(target.matches('[data-env-field]')){const agent=activeAgent(),variable=agent?.env.find((item)=>item.id===target.dataset.envId);if(!variable)return;const field=target.dataset.envField,value=field==='key'?target.value.trim():target.value;if(field==='key'){const valid=!value||/^[A-Za-z_][A-Za-z0-9_]*$/.test(value),duplicate=agent.env.some((item)=>item.id!==variable.id&&item.key===value&&value);if(!valid||duplicate){renderAll();showToast(duplicate?'环境变量名称已存在':'变量名需以字母或下划线开头');return;}}variable[field]=field==='secret'?value==='true':value;if(field==='secret'&&!variable.secret)variable.revealed=false;dirty();renderAll();}if(target.matches('[data-task-sync]')){state.taskSync=target.value;dirty();renderAll();}});
      document.addEventListener('keydown',event=>{trapSheetFocus(event);if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();state.dirty=false;renderAll();showToast('配置已应用到当前项目');return;}if(event.key==='Escape'&&state.agentSheet){closeAgentSheet();return;}if(event.key==='Escape'&&state.sheet){closeSheet();}});
      $('#feishuSheet').addEventListener('mousedown',event=>{if(event.target===$('#feishuSheet'))closeSheet();});
      $('#agentActionSheet').addEventListener('mousedown',event=>{if(event.target===$('#agentActionSheet'))closeAgentSheet();});
      renderAll();
    </script>
  </body>
</html>
